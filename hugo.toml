baseURL = '/'
languageCode = 'en-us'
title = 'Документация Granio'
enableEmoji = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.imports]]
    path = "github.com/colllijo/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[params]
  google_fonts = [
    ["Inter", "300, 400, 600, 700"],
    ["Fira Code", "500, 700"]
  ]

  sans_serif_font = "Inter"
  secondary_font  = "Inter"
  mono_font       = "Fira Code"

  [params.footer]
    copyright = "© :YEAR: The Fyne.io community. Please consider [**sponsoring**](https://fyne.io/sponsor/) our work."

  [params.social]
    github = "Uzer007-admin/granio-docs"
    twitter = "fyne_io"

  [params.docs]
    darkMode = true
    sidebarIcons = true
    logoLinkURL = "https://github.com/Uzer007-admin/granio"
    prism = true
    prismTheme = "lotusdocs"

[permalinks]
  [permalinks.page]
    docs = "/:sections[1:]/:slug/"
  [permalinks.section]
    docs =  "/:slug/"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
